<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gatemirror | Global Insights on Tech, Wellness & Future Economy</title>
    <meta name="description" content="Global insights on technology, wellness, future economy, and sustainable living. Gatemirror delivers deep analysis in 5 languages.">
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:title" content="Gatemirror | Global Insights & Analysis">
    <meta property="og:description" content="Deep insights on tech, wellness, future economy, and sustainable living. Read in 5 languages.">
    <meta property="og:image" content="{{ og_image | default('/assets/og-cover.jpg') }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Gatemirror">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gatemirror | Global Insights & Analysis">
    <meta name="twitter:description" content="Deep insights on tech, wellness, future economy, and sustainable living.">
    <meta name="twitter:image" content="{{ og_image | default('/assets/og-cover.jpg') }}">
    {% for alt in alternate_langs %}
    <link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url }}">
    {% endfor %}
    <link rel="alternate" hreflang="x-default" href="{{ canonical_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
    /* =====================================================
       GATEMIRROR - MASTER CSS (DÜZENLENMİŞ)
       BLOK 1-9
    ===================================================== */
    
    /* =====================================================
       BLOK 1: RESET & VARIABLES
    ===================================================== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    :root {
        --primary: #2ecc71;
        --primary-dark: #1a8c3f;
        --primary-light: #5ee0a0;
        --dark: #0a0a0a;
        --text: #1a1a1a;
        --text-light: #666;
        --gray: #f5f5f5;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.1);
        --border-radius: 1rem;
        --transition: all 0.3s ease;
        
        /* RENK PALETLERİ - 5 KATEGORİ */
        --tech-1: #1a1040;
        --tech-2: #2e1f72;
        --tech-3: #4d38b8;
        --tech-4: #7c66d6;
        --tech-5: #c4b9f0;
        
        --wellness-1: #1a1217;
        --wellness-2: #3d2635;
        --wellness-3: #7a4a6a;
        --wellness-4: #b8849a;
        --wellness-5: #e8cdd8;
        
        --eco-1: #0d1a12;
        --eco-2: #1a3322;
        --eco-3: #2e6645;
        --eco-4: #5fa878;
        --eco-5: #b8ddc7;
        
        --fe-1: #1a1200;
        --fe-2: #3d2c00;
        --fe-3: #8a6400;
        --fe-4: #c9960a;
        --fe-5: #f0d98a;
        
        --el-1: #001820;
        --el-2: #003044;
        --el-3: #006080;
        --el-4: #2a98b8;
        --el-5: #a8dce8;
        
        --category-color: var(--tech-3);
    }
    
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--white);
        line-height: 1.6;
        overflow-x: hidden;
    }
    
    /* =====================================================
       BLOK 2: GLOBAL BİLEŞENLER
    ===================================================== */
    .btn, .archive-btn, .random-btn {
        display: inline-block;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 2rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: var(--transition);
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }
    
    .btn:hover, .archive-btn:hover, .random-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4);
    }
    
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
    }
    
    .section-title {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        font-weight: 700;
    }
    
    /* =====================================================
       BLOK 3: HEADER & NAVIGATION
    ===================================================== */
    nav {
        background: linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.2) 100%,
            rgba(255, 255, 255, 0.7) 50%,
            rgba(255, 255, 255, 0.98) 0%
        );
        backdrop-filter: blur(8px);
        padding: 1rem 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    
    .logo {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        color: var(--dark);
        letter-spacing: -0.5px;
    }
    
    .logo span {
        color: var(--primary-dark);
    }
    
    .nav-links {
        display: flex;
        gap: 2rem;
    }
    
    .nav-links a {
        text-decoration: none;
        color: var(--text);
        font-weight: 500;
        transition: var(--transition);
    }
    
    .nav-links a:hover {
        color: var(--primary);
    }
    
    .menu-btn {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--dark);
    }
    
    /* SIDE MENU (MOBİL) */
    .side-menu {
        position: fixed;
        top: 0;
        left: -100%;
        width: 80%;
        max-width: 300px;
        height: 100%;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(12px);
        color: white;
        transition: left 0.3s ease-in-out;
        z-index: 2000;
        padding: 2rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }
    
    .side-menu.active {
        left: 0;
    }
    
    .close-menu {
        text-align: right;
        font-size: 1.5rem;
        cursor: pointer;
        color: #aaa;
    }
    
    .close-menu:hover {
        color: white;
    }
    
    .side-menu .nav-links {
        display: flex;
        flex-direction: column;
        gap: 0;
    }
    
    .side-menu .nav-links a {
        display: block;
        padding: 0.8rem 0;
        border-bottom: 1px solid #444;
        color: white;
    }
    
    .side-menu .nav-links a:hover {
        color: var(--primary);
    }
    
    .lang-section {
        border-bottom: 1px solid #444;
        padding-bottom: 1rem;
    }
    
    .lang-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #aaa;
        margin-bottom: 0.5rem;
    }
    
    .flags {
        display: flex;
        gap: 1rem;
        margin-top: 0.5rem;
    }
    
    .flag-link {
        font-size: 1.2rem;
        opacity: 0.7;
    }
    
    .flag-link:hover {
        opacity: 1;
    }
    
    .footer-links {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid #444;
        font-size: 0.8rem;
    }
    
    .footer-links a {
        display: block;
        color: #aaa;
        padding: 0.3rem 0;
    }
    
    .footer-links a:hover {
        color: var(--primary);
    }
    
    .dark-mode-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid #444;
    }
    
    .toggle-switch {
        width: 50px;
        height: 24px;
        background: #333;
        border-radius: 30px;
        position: relative;
        cursor: pointer;
    }
    
    .toggle-switch:after {
        content: "🌙";
        position: absolute;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        top: 2px;
        left: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: 0.2s;
    }
    
    /* =====================================================
       BLOK 4: HERO BÖLÜMÜ
    ===================================================== */
    .hero-wrapper {
        position: relative;
        margin-top: -40px;
        padding-top: 60px;
        overflow: hidden;
        background: transparent;
        z-index: 1;
    }
    
    .pattern-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    
    .svg-object {
        position: absolute;
        pointer-events: none;
        object-fit: cover;
    }
    
    .layer-back {
        z-index: 1;
    }
    
    .layer-back .svg-object {
        width: 200%;
        height: 200%;
        top: -50%;
        left: -100%;
        object-position: left center;
        opacity: 0.5;
        animation: driftRight 30s ease-in-out infinite,
                   colorCycleBack 6s ease-in-out infinite;
    }
    
    .color-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(135deg,
            var(--tech-4) 0%,
            var(--wellness-4) 20%,
            var(--fe-4) 40%,
            var(--eco-4) 60%,
            var(--el-4) 80%,
            var(--tech-4) 100%);
        background-size: 200% 200%;
        opacity: 0.45;
        animation: gradientShift 10s ease-in-out infinite;
        pointer-events: none;
        mix-blend-mode: soft-light;
    }
    
    .layer-front {
        z-index: 3;
    }
    
    .layer-front .svg-object {
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        object-position: right center;
        opacity: 0.4;
        animation: driftLeft 25s ease-in-out infinite,
                   colorCycleFront 8s ease-in-out infinite reverse;
    }
    
    .hero-wrapper::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        background: linear-gradient(to top, transparent 0%, var(--white) 100%);
        pointer-events: none;
    }
    
    .hero-wrapper::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        background: linear-gradient(to bottom, transparent 0%, transparent 55%, var(--white) 100%);
        pointer-events: none;
    }
    
    .hero-container {
        position: relative;
        z-index: 5;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
        text-align: center;
    }
    
    .hero-title {
        font-size: clamp(2.5rem, 5vw, 3.5rem) !important;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, var(--tech-2) 0%, var(--tech-3) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    
    .hero-description {
        font-size: 1.7rem !important;
        opacity: 0.9;
        font-weight: 700;
        max-width: 600px;
        margin: 0 auto 1.5rem;
        line-height: 1.5;
        color: var(--tech-3);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    
    /* ANİMASYONLAR */
    @keyframes driftRight {
        0% { transform: translateX(0) translateY(0) rotate(0deg); }
        25% { transform: translateX(60px) translateY(8px) rotate(1deg); }
        50% { transform: translateX(120px) translateY(0) rotate(0deg); }
        75% { transform: translateX(60px) translateY(-8px) rotate(-1deg); }
        100% { transform: translateX(0) translateY(0) rotate(0deg); }
    }
    
    @keyframes driftLeft {
        0% { transform: translateX(0) translateY(0) rotate(0deg); }
        25% { transform: translateX(-60px) translateY(-8px) rotate(-1deg); }
        50% { transform: translateX(-120px) translateY(0) rotate(0deg); }
        75% { transform: translateX(-60px) translateY(8px) rotate(1deg); }
        100% { transform: translateX(0) translateY(0) rotate(0deg); }
    }
    
    @keyframes colorCycleBack {
        0%   { filter: hue-rotate(0deg) saturate(1.8) brightness(0.6); }
        25%  { filter: hue-rotate(90deg) saturate(1.8) brightness(0.6); }
        50%  { filter: hue-rotate(180deg) saturate(1.8) brightness(0.6); }
        75%  { filter: hue-rotate(270deg) saturate(1.8) brightness(0.6); }
        100% { filter: hue-rotate(360deg) saturate(1.8) brightness(0.6); }
    }
    
    @keyframes colorCycleFront {
        0%   { filter: hue-rotate(300deg) saturate(1.6) brightness(0.7); }
        25%  { filter: hue-rotate(30deg) saturate(1.6) brightness(0.7); }
        50%  { filter: hue-rotate(120deg) saturate(1.6) brightness(0.7); }
        75%  { filter: hue-rotate(210deg) saturate(1.6) brightness(0.7); }
        100% { filter: hue-rotate(300deg) saturate(1.6) brightness(0.7); }
    }
    
    @keyframes gradientShift {
        0% { opacity: 0.4; background-position: 0% 50%; }
        50% { opacity: 0.6; background-position: 100% 50%; }
        100% { opacity: 0.4; background-position: 0% 50%; }
    }
    
    /* =====================================================
       BLOK 5: MANIFESTO BÖLÜMÜ
    ===================================================== */
    .manifesto {
        max-width: 1200px;
        margin: 3rem auto;
        padding: 0 1.5rem;
    }
    
    .manifesto-hero {
        margin-bottom: 4rem;
    }
    
    .manifesto-hero-image {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .manifesto-hero-image img {
        max-width: 100%;
        max-height: 400px;
        border-radius: 1.5rem;
        object-fit: cover;
    }
    
    .manifesto-hero-content {
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
    }
    
    .manifesto-two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
    }
    
    .manifesto-image-full {
        text-align: center;
        margin: 2rem 0 3rem;
    }
    
    .manifesto-image-full img {
        max-width: 100%;
        max-height: 300px;
        border-radius: 1rem;
        object-fit: cover;
    }
    
    .manifesto-three-col {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        margin: 3rem 0;
    }
    
    .manifesto-card {
        background: rgba(0, 0, 0, 0.02);
        padding: 1.5rem;
        border-radius: 1rem;
        transition: var(--transition);
    }
    
    .manifesto-card:hover {
        transform: translateY(-5px);
        background: rgba(0, 0, 0, 0.04);
    }
    
    .manifesto-closing {
        text-align: center;
        margin-top: 3rem;
        padding-top: 2rem;
    }
    
    .manifesto-closing-image {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .manifesto-closing-image img {
        max-width: 100%;
        max-height: 250px;
        border-radius: 1rem;
        object-fit: cover;
    }
    
    .manifesto-closing-content {
        max-width: 700px;
        margin: 0 auto;
    }
    
    .manifesto-quote {
        font-size: 1.2rem;
        color: var(--text-light);
        margin-bottom: 1rem;
    }
    
    .manifesto-quote-large {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--primary);
        margin: 1.5rem 0;
    }
    
    .manifesto-button {
        display: inline-block;
        background: linear-gradient(135deg, var(--tech-2), var(--tech-3));
        color: white;
        padding: 0.75rem 2rem;
        border-radius: 2rem;
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
    }
    
    .manifesto-button:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, var(--tech-3), var(--tech-4));
    }
    
    .manifesto-button span {
        transition: transform 0.2s ease;
        display: inline-block;
    }
    
    .manifesto-button:hover span {
        transform: translateX(5px);
    }
    
    /* MANIFESTO TYPOGRAPHY */
    .manifesto-title {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--tech-2), var(--tech-4));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
    }
    
    .manifesto-subtitle {
        font-size: 1.2rem;
        color: var(--text-light);
        font-weight: 400;
        margin-bottom: 1.5rem;
    }
    
    .manifesto-category {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 0.75rem;
    }
    
    .manifesto-text {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text);
        margin-bottom: 1rem;
    }
    
    .manifesto-text-small {
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--text-light);
    }
    
    .manifesto-text-center {
        text-align: center;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text);
        margin-bottom: 1rem;
    }
    
    .manifesto-icon {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        display: inline-block;
    }
    
    .manifesto-card-icon {
        font-size: 2rem;
        margin-bottom: 1rem;
        display: inline-block;
    }
    
    /* =====================================================
       BLOK 6: ARTICLE GRID & FEATURED
    ===================================================== */
    .featured {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
    }
    
    .featured-card {
        display: flex;
        gap: 2rem;
        background: var(--white);
        border-radius: var(--border-radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        transition: var(--transition);
    }
    
    .featured-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-hover);
    }
    
    .featured-card img {
        width: 50%;
        object-fit: cover;
    }
    
    .featured-content {
        padding: 2rem;
        flex: 1;
    }
    
    .featured-content h2 {
        font-size: 1.8rem;
    }
    
    .featured-meta {
        color: var(--text-light);
        font-size: 0.9rem;
        margin: 0.5rem 0;
        display: flex;
        gap: 1rem;
    }
    
    .article-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 2rem;
    }
    
    .article-grid .article-card:first-child {
        grid-column: span 2;
    }
    
    .article-grid .article-card:first-child img {
        height: 300px;
    }
    
    .article-grid .article-card:first-child h3 {
        font-size: 1.4rem;
    }
    
    .article-card {
        background: var(--white);
        border-radius: var(--border-radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        transition: var(--transition);
        display: block;
    }
    
    .article-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-hover);
    }
    
    .article-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
    
    .article-card h3 {
        padding: 1rem 1rem 0.5rem;
        font-size: 1.2rem;
    }
    
    .article-meta {
        padding: 0 1rem;
        display: flex;
        gap: 1rem;
        font-size: 0.8rem;
        color: var(--text-light);
    }
