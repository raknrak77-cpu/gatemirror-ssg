name: Pattern Factory - Vektörel Desen Üretici

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install svgwrite
          
      - name: Pattern Factory Üret
        run: python bots/pattern_factory.py
        
      - name: GitHub'a Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/patterns/
          if git diff --staged --quiet; then
            echo "📭 Yeni desen yok, commit atlanıyor."
          else
            git commit -m "🎨 Pattern Factory: 125 vektörel desen eklendi (5 kategori × 5 seviye × 5 adet)"
            git push origin main
          fi
