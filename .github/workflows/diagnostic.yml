name: 🔬 Diagnostic Bot - Raw Articles Analysis

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit (örnek: 50, boş bırakırsanız hepsi)'
        required: false
        default: ''
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests pillow jinja2
      
      - name: 🧪 Run Diagnostic Bot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          echo "🔬 Diagnostic Bot çalıştırılıyor..."
          python bots/diagnostic_bot.py
      
      - name: 📤 Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-report-${{ github.run_id }}
          path: |
            diagnostic_report.txt
            diagnostic_results.json
          retention-days: 7
