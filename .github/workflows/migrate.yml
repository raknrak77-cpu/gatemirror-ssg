name: Migrate Tasks (Tek Seferlik)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run migration
        run: |
          python bots/migrate_tasks.py
      
      - name: Upload task folder
        uses: actions/upload-artifact@v4
        with:
          name: task-folder
          path: task/
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add task/ tasks.json.backup.*
          git commit -m "chore: migrate tasks to task/ folder [skip ci]" || echo "No changes"
          git push || echo "Push failed"
