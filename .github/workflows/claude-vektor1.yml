name: Claude Vektör 1 - Pattern Factory (Önizlemeli)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          
      - name: Claude Vektör 1 Pattern Üret
        run: python bots/claude-vektor1.py
        
      - name: GitHub'a Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || echo "Pull yapılamadı, devam..."
          git add assets/claude1/
          if git diff --staged --quiet; then
            echo "📭 Yeni desen yok, commit atlanıyor."
          else
            git commit -m "🎨 Claude Vektör 1: 125 desen eklendi (assets/claude1/) - Önizleme modu açık"
            git push origin main || git push --force origin main
          fi
          
      - name: Upload Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: claude1-patterns
          path: assets/claude1/
