name: SSG Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          pip install requests boto3 beautifulsoup4 markdown jinja2
          
      - name: Klasor Yapisini Kontrol Et (Yoksa Olustur)
        run: python bots/setup.py
        
      # Creator bot henüz yazılmadı, geçici olarak pas geçiyoruz
      # - name: Creator Bot (tasks.json -> Markdown)
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #   run: python bots/creator.py
        
      # Translator bot henüz yazılmadı, pas geçiyoruz
      # - name: Translator Bot (en -> es, de, fr)
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #   run: python bots/translator.py
        
      # Builder bot henüz yazılmadı, pas geçiyoruz
      # - name: Builder Bot (Markdown -> HTML)
      #   run: python bots/builder.py
        
      - name: Cloudflare Pages Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=gatemirror-ssg --branch=main
