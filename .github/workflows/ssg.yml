name: SSG Build (Cloudflare Yok)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          pip install requests boto3 beautifulsoup4 markdown jinja2
          
      - name: Klasor Yapisini Kontrol Et
        run: python bots/setup.py
        
      - name: Creator Bot (tasks.json -> Markdown) [TASLAK]
        run: |
          echo "Creator bot henüz yazılmadı. Bu adım şimdilik boş."
          # python bots/creator.py
        
      - name: Builder Bot (Markdown -> HTML) [TASLAK]
        run: |
          echo "Builder bot henüz yazılmadı. Bu adım şimdilik boş."
          # python bots/builder.py
        
      - name: public klasorunu kontrol et (geçici)
        run: |
          if [ ! -d "public" ]; then
            mkdir -p public
            echo "<h1>Gatemirror SSG</h1><p>Yapım aşamasında. Yakında içerikler gelecek.</p>" > public/index.html
          fi
