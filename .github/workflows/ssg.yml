name: SSG Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          pip install requests boto3 beautifulsoup4 markdown jinja2
          
      - name: Klasor Yapisini Olustur ve Git'e Kaydet
        run: python bots/setup.py
        
      - name: Creator Bot (Taslak)
        run: |
          echo "✅ Creator bot henüz yazılmadı. İleride eklenecek."
          
      - name: Builder Bot (Taslak)
        run: |
          echo "✅ Builder bot henüz yazılmadı. İleride eklenecek."
