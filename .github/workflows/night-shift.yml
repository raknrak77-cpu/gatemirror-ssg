name: SSG Build & Deploy (nigh 4Lang + Hero Bot)

on:
  workflow_dispatch:
  schedule:
    # Sabah 05:17'den başlayarak 32 dakika aralıklarla (Türkiye Saati)
    # UTC: 02:17, 02:49, 03:21, 03:53, 04:25, 04:57, 05:29, 06:01, 06:33, 07:05
    - cron: '17 4 * * *'   # 04:17 TS
    - cron: '49 4 * * *'   # 04:49 TS
    - cron: '21 5 * * *'   # 05:21 TS
    - cron: '53 5 * * *'   # 05:53 TS
    - cron: '25 6 * * *'   # 06:25 TS
    - cron: '57 6 * * *'   # 06:57 TS
    - cron: '29 7 * * *'   # 07:29 TS
    - cron: '1 8 * * *'    # 08:01 TS
    - cron: '33 8 * * *'   # 08:33 TS
    - cron: '5 9 * * *'    # 09:05 TS

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Pip Cache (Hızlandırma)
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=100 --retries=5 \
            requests boto3 beautifulsoup4 markdown jinja2 pillow
          
      - name: 0. Starter Bot (Template + Task Kontrol - Kota Harcamadan Once)
        run: python bots/starter-bot.py
        
      - name: 1. Creator Bot (4 Dil Tek Prompt + Gorseller)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/creator.py
        
      - name: 2. Uploader (Ham HTML'leri + Hero.json R2'ye Yukle - Tüm Diller)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/uploader.py
        
      - name: 3. Hero Bot (Hero.json Oku, Dinamik Hero HTML Uret)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/hero_bot.py
        
      - name: 4. Publisher (Makeup + Hero Bot ile Tum Sayfalari Render Et - 4 Dil)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/publisher.py
        
      - name: 5. Kütüphaneci Bot (Statik Arşiv Sayfaları - Tüm Diller)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/librarian.py
        
      - name: 6. Git Kayit (tasks.json - content/ uploader tarafindan silinir)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || echo "Pull yapılamadı, devam..."
          git add content/ tasks.json
          if git diff --staged --quiet; then
            echo "📭 Değişiklik yok, commit atlanıyor."
          else
            git commit -m "🌙 Night Shift: SSG Multilingual 4Lang + Hero Bot build (EN/ES/DE/FR)"
            git push origin main || git push --force origin main
          fi
