name: SSG Night Shift (Auto Build - Full)

on:
  workflow_dispatch:
  schedule:
    # Sabah 05:17'den başlayarak 32 dakika aralıklarla (Türkiye Saati)
    # UTC: 02:17, 02:49, 03:21, 03:53, 04:25, 04:57, 05:29, 06:01, 06:33, 07:05
    - cron: '17 3 * * *'   # 05:17 TS
    - cron: '49 3 * * *'   # 05:49 TS
    - cron: '21 4 * * *'   # 06:21 TS
    - cron: '53 5 * * *'   # 06:53 TS
    - cron: '25 6 * * *'   # 07:25 TS
    - cron: '57 6 * * *'   # 07:57 TS
    - cron: '29 7 * * *'   # 08:29 TS
    - cron: '1 7 * * *'    # 09:01 TS
    - cron: '33 8 * * *'   # 09:33 TS
    - cron: '5 9 * * *'    # 10:05 TS

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=100 --retries=5 \
            requests boto3 beautifulsoup4 markdown jinja2 pillow
          
      - name: 0. Starter Bot (Template + Task Kontrol)
        run: python bots/starter-bot.py
        
      - name: 1. Creator Bot (4 Dil Tek Prompt + Gorseller)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/creator.py
        
      - name: 2. Uploader (Ham HTML'leri R2'ye Yukle - Tüm Diller)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/uploader.py
        
      - name: 3. Publisher (Tum Sayfalari R2'den Oku, Makeup ile Makyajla, Template ile Birlestir - 4 Dil)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/publisher.py
        
      - name: 4. Kütüphaneci Bot (Statik Arşiv Sayfaları - Tüm Diller)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python bots/librarian.py
        
      - name: 5. Git Kayit (tasks.json - content/ uploader tarafindan silinir)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || echo "Pull yapılamadı, devam..."
          git add content/ tasks.json
          if git diff --staged --quiet; then
            echo "📭 Değişiklik yok, commit atlanıyor."
          else
            git commit -m "🌙 Night Shift: SSG Multilingual 4Lang Full Build (EN/ES/DE/FR)"
            git push origin main || git push --force origin main
          fi
