name: Deepseek Pattern - Wellness Vektör Desenleri

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          
      - name: Deepseek Wellness Pattern Üret
        run: python bots/deepseek-pattern.py
        
      - name: GitHub'a Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || echo "Pull yapılamadı, devam..."
          git add assets/wellness-variations/
          if git diff --staged --quiet; then
            echo "📭 Yeni desen yok, commit atlanıyor."
          else
            git commit -m "🌿 Wellness Variations: Yatay/eliptik/dalgalı spiral desenler eklendi"
            git push origin main || git push --force origin main
          fi
          
      - name: Upload Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: wellness-variations-patterns
          path: assets/wellness-variations/
