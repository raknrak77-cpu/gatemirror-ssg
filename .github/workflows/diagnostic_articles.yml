name: 🔬 Diagnostic Articles - Yayınlanan Makale Kalite Kontrolü

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📥 Install dependencies
        run: pip install boto3
      
      - name: 🧪 Run Articles Diagnostic Bot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python bots/diagnostic_articles.py
      
      - name: 📤 Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: articles-diagnostic-report-${{ github.run_id }}
          path: articles_diagnostic_report.txt
          retention-days: 7
