name: Delete ilk_demo from R2

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kütüphaneleri Yükle
        run: pip install boto3
      
      - name: Create Delete Bot
        run: |
          cat > delete_script.py << 'EOF'
          import os
          import boto3
          from botocore.client import Config
          
          R2_ID = os.getenv('R2_ACCOUNT_ID')
          R2_ACCESS_KEY = os.getenv('R2_ACCESS_KEY_ID')
          R2_SECRET_KEY = os.getenv('R2_SECRET_ACCESS_KEY')
          R2_BUCKET = os.getenv('R2_BUCKET_NAME')
          
          s3 = boto3.client(
              's3',
              endpoint_url=f'https://{R2_ID}.r2.cloudflarestorage.com',
              aws_access_key_id=R2_ACCESS_KEY,
              aws_secret_access_key=R2_SECRET_KEY,
              config=Config(signature_version='s3v4'),
              region_name='auto'
          )
          
          def delete_folder(prefix):
              continuation_token = None
              deleted_count = 0
              while True:
                  if continuation_token:
                      response = s3.list_objects_v2(Bucket=R2_BUCKET, Prefix=prefix, ContinuationToken=continuation_token)
                  else:
                      response = s3.list_objects_v2(Bucket=R2_BUCKET, Prefix=prefix)
                  if 'Contents' not in response:
                      break
                  for obj in response['Contents']:
                      key = obj['Key']
                      try:
                          s3.delete_object(Bucket=R2_BUCKET, Key=key)
                          print(f"   🗑️ Silindi: {key}")
                          deleted_count += 1
                      except Exception as e:
                          print(f"   ❌ Hata: {key} - {e}")
                  if response.get('IsTruncated'):
                      continuation_token = response.get('NextContinuationToken')
                  else:
                      break
              print(f"✅ Toplam {deleted_count} dosya silindi.")
          
          print("🗑️ ilk_demo klasörü siliniyor...")
          delete_folder("ilk_demo/")
          print("✅ ilk_demo tamamen silindi.")
          EOF
      
      - name: Run Delete Bot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python delete_script.py
