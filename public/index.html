<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gatemirror</title>
    <script>
        // R2 base URL
        const R2_BASE = 'https://pub-f9790eb09fb8460a9ba4e1509db5b135.r2.dev';
        
        // Mevcut URL'yi al (örn: /en/future-economy/6af03d83.html)
        const path = window.location.pathname;
        
        // Eğer kök dizinse (/) /articles/en/ adresine yönlendir
        if (path === '/' || path === '') {
            window.location.href = R2_BASE + '/articles/en/index.html';
        } else {
            // R2'deki karşılığını bul (örnek: /en/... -> /articles/en/...)
            let r2Path = path;
            if (r2Path.startsWith('/en/')) {
                r2Path = '/articles' + r2Path;
            } else if (r2Path.startsWith('/es/') || r2Path.startsWith('/de/') || r2Path.startsWith('/fr/')) {
                r2Path = '/articles' + r2Path;
            } else {
                r2Path = '/articles/en/index.html';
            }
            window.location.href = R2_BASE + r2Path;
        }
    </script>
</head>
<body>
    <p>Yönlendiriliyor...</p>
</body>
</html>
